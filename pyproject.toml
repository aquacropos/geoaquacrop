[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geoaquacrop"
version = "0.1.0"
description = "Unified entry point to the GeoAquaCrop toolchain: preprocessing, gridded simulation, and visualisation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Josias Lang-Ritter" },
    { name = "Chris Bowden" },
    { name = "Seyed Hossein Hosseini" },
    { name = "Henrikki Tenkanen" },
    { name = "Tim Foster" },
    ]
maintainers = [
    { name = "Josias Lang-Ritter", email = "josias.lang-ritter@aalto.fi" },
    { name = "Chris Bowden", email = "christopher.bowden@manchester.ac.uk" },
    { name = "Seyed Hossein Hosseini", email = "seyed.h.hosseini@aalto.fi" },
]
keywords = ["aquacrop", "crop model", "water productivity", "gridded", "agriculture"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Hydrology",
]

# The meta-package installs the three components. Version floors only, so each
# can be released independently without a coordinated bump here.
dependencies = [
    "geoaquacrop_preprocess>=0.1",
    "geoaquacrop_simulate>=0.1",
    "geoaquacrop_visualize>=0.1",
]

[project.optional-dependencies]
docs = ["sphinx>=7", "furo"]

[project.urls]
Homepage = "https://github.com/aquacropos/geoaquacrop"
Documentation = "https://geoaquacrop.readthedocs.io"
Preprocessing = "https://geoaquacrop-preprocessing.readthedocs.io/en/latest/"
Simulation = "https://github.com/aquacropos/geoaquacrop_simulate"
Visualization = "https://github.com/aquacropos/geoaquacrop_visualize"

# The umbrella ships the `geoaquacrop` façade package (a thin, lazily-imported
# wrapper over the three stage packages) plus the dependency metadata.
[tool.setuptools.packages.find]
where = ["src"]
