# Publish geoaquacrop to PyPI (or TestPyPI) when a release tag is pushed.
#
# Setup, once, on PyPI: Account settings -> Publishing -> add a trusted
# publisher for this repository, workflow "publish.yml", environment "pypi".
# Trusted publishing needs no API token stored in GitHub.
name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:          # lets you publish to TestPyPI by hand

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # to target TestPyPI instead, uncomment:
        # with:
        #   repository-url: https://test.pypi.org/legacy/
