# Smoke-test the façade.
#
# The umbrella depends on the three stage packages, which are installed here
# with --no-deps so this workflow passes whether or not they are on PyPI yet.
# That means it checks the façade itself -- that it imports, reports a version,
# and exposes the three stages -- and not the stages behind it, which have their
# own suites in their own repositories.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the façade without its stage dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps .

      # Importing must stay cheap and must not require any stage to be present.
      - name: Import and report version
        run: python -c "import geoaquacrop as gac; print(gac.__version__)"

      # Each stage attribute must exist, and must raise a clear, actionable
      # error when the stage package is absent -- never AttributeError or
      # ModuleNotFoundError straight from the import machinery.
      - name: Each stage reports itself as missing, informatively
        shell: python
        run: |
          import geoaquacrop as gac

          for stage in ("preprocess", "simulate", "visualize"):
              try:
                  getattr(gac, stage).run
              except Exception as error:
                  message = str(error)
                  assert "pip install" in message, (
                      f"{stage}: error does not tell the user how to fix it: {message!r}"
                  )
                  print(f"{stage}: {type(error).__name__}: {message.splitlines()[0]}")
              else:
                  print(f"{stage}: installed, run() resolved")
